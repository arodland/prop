[project]
name = "forecast"
version = "0.0.1"
description = "Next-generation ionospheric forecast model: data snapshot, replay evaluation, baselines, models. See ../PLAN.md."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "flask>=3.1.3",
    "h5py>=3.16.0",
    "hdf5plugin>=7.1.0",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pyiri==0.1.7",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
train = ["torch>=2.4,<2.9"]  # 2.8.x = cu128 wheels on PyPI, matching the service image and the A4500 driver; Scranton uses the cu124 build

